<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSpeakForYoutube 收藏</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>CodeSpeak</h1>
        <p>我的收藏单词</p>
      </div>
      <span id="word-count" aria-live="polite">0</span>
    </header>
    <section class="translation-settings" aria-labelledby="translation-settings-title">
      <h2 id="translation-settings-title">百度智能云词典翻译</h2>
      <form id="translation-settings-form">
        <label for="translation-api-url">代理地址</label>
        <div class="settings-row">
          <input
            id="translation-api-url"
            type="url"
            placeholder="https://your-worker.workers.dev/api/translate"
            autocomplete="url"
            required
          />
          <button type="submit">保存</button>
        </div>
      </form>
      <p id="translation-settings-status" class="settings-status" aria-live="polite">
        尚未配置，将继续显示 Mock 释义。
      </p>
    </section>
    <main>
      <div id="empty-state" class="empty-state">
        在 YouTube 英文字幕中点击单词，再点“收藏”。
      </div>
      <ul id="word-list" class="word-list" aria-label="收藏单词列表"></ul>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
